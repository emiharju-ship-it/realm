<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Table Staff Directory & Role Hierarchy Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Cinzel for High Table Continental elegance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        continental: {
                            black: '#08080a',
                            dark: '#0f1015',
                            card: '#151720',
                            border: '#2a2d3d',
                            gold: '#d4af37',
                            goldHover: '#f3cf55',
                            emerald: '#10b981',
                            crimson: '#dc2626',
                            purple: '#8b5cf6',
                            blue: '#3b82f6',
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'gold-glow': '0 0 20px rgba(212, 175, 55, 0.25)',
                        'crimson-glow': '0 0 20px rgba(220, 38, 38, 0.35)',
                        'emerald-glow': '0 0 20px rgba(16, 185, 129, 0.25)',
                        'blue-glow': '0 0 20px rgba(59, 130, 246, 0.35)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #08080a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 90% 80%, rgba(220, 38, 38, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(21, 23, 32, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .glass-panel-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel-hover:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.15);
        }

        /* Custom Ticker animation */
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
        .animate-ticker {
            display: inline-flex;
            white-space: nowrap;
            animation: ticker 30s linear infinite;
        }
        .animate-ticker:hover {
            animation-play-state: paused;
        }

        /* Gold gradient text */
        .gold-gradient-text {
            background: linear-gradient(135deg, #fff2a3 0%, #d4af37 50%, #aa820a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Crimson gradient text */
        .crimson-gradient-text {
            background: linear-gradient(135deg, #fca5a5 0%, #dc2626 50%, #7f1d1d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Blue gradient text */
        .blue-gradient-text {
            background: linear-gradient(135deg, #93c5fd 0%, #3b82f6 50%, #1e3a8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1015;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d3d;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-200">
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header / Navigation Bar -->
    <header class="sticky top-0 z-40 w-full glass-panel border-b border-continental-border/80 px-4 lg:px-8 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Brand Logo / Title -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-continental-gold via-yellow-600 to-amber-900 flex items-center justify-center shadow-gold-glow">
                    <i class="fa-solid fa-coins text-continental-black text-xl"></i>
                </div>
                <div>
                    <h1 class="font-cinzel text-xl md:text-2xl font-bold tracking-wider gold-gradient-text">HIGH TABLE</h1>
                    <p class="text-xs text-slate-400 tracking-widest uppercase">Staff Directory & Directive Dashboard</p>
                </div>
            </div>

            <!-- Ticker & Quick Status -->
            <div class="hidden lg:flex items-center gap-3 bg-continental-dark/80 px-3 py-1.5 rounded-full border border-continental-crimson/30 max-w-md overflow-hidden relative">
                <span class="flex h-2 w-2 relative shrink-0">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-continental-crimson opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-continental-crimson"></span>
                </span>
                <div class="text-xs text-slate-300 font-mono overflow-hidden whitespace-nowrap">
                    <div class="animate-ticker">
                        <span class="mr-6 text-continental-crimson font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> EXCOMMUNICADO: BabaYaga Active (40 Gold Bounties)</span>
                        <span class="mr-6 text-continental-gold"><i class="fa-solid fa-shield-halved mr-1"></i> Continental Protection: Active at Town Hall</span>
                        <span class="mr-6 text-emerald-400"><i class="fa-solid fa-store mr-1"></i> Trader Camp: Strictly 1 Player Zone</span>
                    </div>
                </div>
            </div>

            <!-- Header Action Controls -->
            <div class="flex items-center gap-2 sm:gap-3 w-full md:w-auto justify-end">
                <button onclick="openApplyModal()" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-continental-gold/10 hover:bg-continental-gold/20 text-continental-gold border border-continental-gold/40 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Apply For Role</span>
                </button>
                <button onclick="openQuickTemplatesModal()" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-continental-card hover:bg-slate-800 text-slate-300 border border-continental-border transition-all flex items-center gap-2">
                    <i class="fa-solid fa-copy text-continental-gold"></i>
                    <span class="hidden sm:inline">Staff Templates</span>
                </button>
                <button onclick="exportData()" title="Export JSON Data" class="p-2 text-xs rounded-lg bg-continental-card hover:bg-slate-800 text-slate-300 border border-continental-border">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button onclick="document.getElementById('importFileInput').click()" title="Import JSON Data" class="p-2 text-xs rounded-lg bg-continental-card hover:bg-slate-800 text-slate-300 border border-continental-border">
                    <i class="fa-solid fa-upload"></i>
                </button>
                <input type="file" id="importFileInput" class="hidden" accept=".json" onchange="importData(event)">
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-8">

        <!-- Top Widgets Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            
            <!-- High Table Active Bounty Widget -->
            <div class="glass-panel rounded-xl p-5 border-l-4 border-l-continental-crimson flex flex-col justify-between relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 opacity-10 text-continental-crimson text-8xl pointer-events-none">
                    <i class="fa-solid fa-skull"></i>
                </div>
                <div>
                    <div class="flex items-center justify-between
